<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#1E7AFC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="校园搭子" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>" />
  <link rel="manifest" href="/manifest.json" />
  <title>校园搭子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=20260718" />
</head>
<body>
  <div id="app">
    <div id="pages">

      <!-- ═══════ 首页 ═══════ -->
      <section class="page" id="page-home">
        <div class="page-body home-body">
          <div class="home-hero">
            <div class="home-hero-icon">🎒</div>
            <h2>校园搭子</h2>
            <p>一句话，校园琐事全安排好</p>
          </div>
          <div class="home-cards">
            <div class="home-card" onclick="switchTab('zone')">
              <span class="home-card-icon"><svg class="icon icon-xl" width="28" height="28" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="40" width="72" height="72" rx="12"/><rect x="144" y="40" width="72" height="72" rx="12"/><rect x="40" y="144" width="72" height="72" rx="12"/><rect x="144" y="144" width="72" height="72" rx="12"/></svg></span>
              <div class="home-card-info">
                <div class="home-card-title">综合区</div>
                <div class="home-card-desc">课表 · 考试 · 成绩 · 教室 · 一卡通 · 地图</div>
              </div>
              <svg class="icon icon-sm home-card-arrow" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="96 48 176 128 96 208"/></svg>
            </div>
            <div class="home-card" onclick="switchTab('agent')">
              <span class="home-card-icon"><svg class="icon icon-xl" width="28" height="28" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="56" width="192" height="144" rx="24"/><circle cx="92" cy="112" r="12"/><circle cx="164" cy="112" r="12"/><line x1="128" y1="136" x2="128" y2="168"/><line x1="92" y1="168" x2="164" y2="168"/><line x1="80" y1="56" x2="80" y2="32"/><line x1="176" y1="56" x2="176" y2="32"/><circle cx="84" cy="192" r="12"/><circle cx="172" cy="192" r="12"/></svg></span>
              <div class="home-card-info">
                <div class="home-card-title">AI 助手</div>
                <div class="home-card-desc">自由对话，想问什么问什么</div>
              </div>
              <svg class="icon icon-sm home-card-arrow" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="96 48 176 128 96 208"/></svg>
            </div>
            <div class="home-card" onclick="switchTab('community')">
              <span class="home-card-icon"><svg class="icon icon-xl" width="28" height="28" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="92" cy="56" r="24"/><path d="M150 104a56 56 0 0 0-116 0"/><circle cx="176" cy="96" r="20"/><path d="M220 144a48 48 0 0 0-88 0"/></svg></span>
              <div class="home-card-info">
                <div class="home-card-title">社区</div>
                <div class="home-card-desc">论坛 · 活动 · 二手 · 失物招领</div>
              </div>
              <svg class="icon icon-sm home-card-arrow" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="96 48 176 128 96 208"/></svg>
            </div>
            <div class="home-card" onclick="switchTab('profile')">
              <span class="home-card-icon"><svg class="icon icon-xl" width="28" height="28" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="128" r="96"/><circle cx="128" cy="92" r="32"/><path d="M64 200a80 80 0 0 1 128 0"/></svg></span>
              <div class="home-card-info">
                <div class="home-card-title">个人主页</div>
                <div class="home-card-desc">消费记录 · 成绩绩点 · 快递包裹</div>
              </div>
              <svg class="icon icon-sm home-card-arrow" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="96 48 176 128 96 208"/></svg>
            </div>
          </div>
        </div>
      </section>

      <!-- ═══════ 综合区 ═══════ -->
      <section class="page" id="page-zone">
        <div class="zone-grid" id="zone-grid">
          <div class="zone-item" onclick="zoneLoad('schedule')">
            <svg class="icon zone-item-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="40" width="176" height="176" rx="16"/><line x1="40" y1="88" x2="216" y2="88"/><line x1="88" y1="24" x2="88" y2="56"/><line x1="168" y1="24" x2="168" y2="56"/><circle cx="96" cy="128" r="8" fill="currentColor" stroke="none"/><circle cx="128" cy="128" r="8" fill="currentColor" stroke="none"/><circle cx="160" cy="128" r="8" fill="currentColor" stroke="none"/></svg>
            <span class="zone-item-label">今日课表</span>
          </div>
          <div class="zone-item" onclick="zoneLoad('exam')">
            <svg class="icon zone-item-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M160 40a8 8 0 0 1 8 8v16H88V48a8 8 0 0 1 8-8Z"/><rect x="56" y="64" width="144" height="168" rx="16"/><line x1="96" y1="112" x2="160" y2="112"/><line x1="96" y1="144" x2="160" y2="144"/><line x1="96" y1="176" x2="128" y2="176"/></svg>
            <span class="zone-item-label">考试日程</span>
          </div>
          <div class="zone-item" onclick="zoneLoad('grade')">
            <svg class="icon zone-item-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="144" width="40" height="72" rx="8"/><rect x="108" y="88" width="40" height="128" rx="8"/><rect x="176" y="40" width="40" height="176" rx="8"/></svg>
            <span class="zone-item-label">成绩绩点</span>
          </div>
          <div class="zone-item" onclick="zoneLoad('classroom')">
            <svg class="icon zone-item-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="64" width="72" height="168" rx="8"/><line x1="56" y1="96" x2="80" y2="96"/><line x1="56" y1="128" x2="80" y2="128"/><line x1="56" y1="160" x2="80" y2="160"/><rect x="120" y="112" width="72" height="120" rx="8"/><line x1="144" y1="144" x2="168" y2="144"/><line x1="144" y1="176" x2="168" y2="176"/><rect x="160" y="40" width="64" height="72" rx="8"/><line x1="184" y1="64" x2="200" y2="64"/><line x1="184" y1="88" x2="200" y2="88"/></svg>
            <span class="zone-item-label">空教室</span>
          </div>
          <div class="zone-item" onclick="zoneLoad('card')">
            <svg class="icon zone-item-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="56" width="208" height="144" rx="16"/><line x1="24" y1="104" x2="232" y2="104"/><line x1="64" y1="160" x2="96" y2="160"/><line x1="120" y1="160" x2="136" y2="160"/></svg>
            <span class="zone-item-label">一卡通</span>
          </div>
          <div class="zone-item" onclick="zoneLoad('map')">
            <svg class="icon zone-item-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="80" r="40"/><path d="M128 232c64-80 64-152 0-152S64 152 64 232Z"/></svg>
            <span class="zone-item-label">校园地图</span>
          </div>
        </div>
        <div class="detail-panel hidden" id="zone-detail">
          <div class="detail-header">
            <button class="back-btn" onclick="zoneBack()">
              <svg class="icon icon-sm" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="216" y1="128" x2="40" y2="128"/><polyline points="96 72 40 128 96 184"/></svg>
              <span>返回</span>
            </button>
            <span class="detail-title" id="zone-detail-title"></span>
          </div>
          <div class="detail-body" id="zone-detail-body">
            <div class="loading-spinner">
              <svg class="icon icon-spin icon-lg" width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="128" y1="32" x2="128" y2="64"/><line x1="196" y1="60" x2="173.3" y2="82.7"/><line x1="224" y1="128" x2="192" y2="128"/><line x1="196" y1="196" x2="173.3" y2="173.3"/><line x1="128" y1="224" x2="128" y2="192"/><line x1="60" y1="196" x2="82.7" y2="173.3"/><line x1="32" y1="128" x2="64" y2="128"/><line x1="60" y1="60" x2="82.7" y2="82.7"/></svg>
              <span>加载中…</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ═══════ Agent 聊天 ═══════ -->
      <section class="page active" id="page-agent">
        <div class="agent-topbar">
          <span class="agent-avatar">
            <svg class="icon" width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" style="color:#fff"><rect x="32" y="56" width="192" height="144" rx="24"/><circle cx="92" cy="112" r="12"/><circle cx="164" cy="112" r="12"/><line x1="128" y1="136" x2="128" y2="168"/><line x1="92" y1="168" x2="164" y2="168"/><line x1="80" y1="56" x2="80" y2="32"/><line x1="176" y1="56" x2="176" y2="32"/><circle cx="84" cy="192" r="12"/><circle cx="172" cy="192" r="12"/></svg>
          </span>
          <span class="agent-name">校园搭子</span>
          <span class="agent-tag">AI</span>
          <div class="agent-spacer"></div>
          <button class="agent-top-btn" onclick="openHistory()" title="历史对话">
            <svg class="icon" width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="128" r="96"/><polyline points="128 72 128 128 176 152"/></svg>
            <span class="agent-top-btn-label">历史</span>
          </button>
          <button class="agent-top-btn agent-top-btn-new" onclick="newConversation()" title="开启新对话">
            <svg class="icon" width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="128" y1="40" x2="128" y2="216"/><line x1="40" y1="128" x2="216" y2="128"/></svg>
            <span class="agent-top-btn-label">新对话</span>
          </button>
        </div>
        <main id="chat"></main>
        <div id="suggestions"></div>
        <footer>
          <input id="input" type="text" placeholder="说点什么…" autocomplete="off" />
          <button id="send">
            <svg class="icon" width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" style="color:#fff"><polyline points="96 48 176 128 96 208"/></svg>
          </button>
        </footer>
      </section>

      <!-- ═══════ 社区 ═══════ -->
      <section class="page" id="page-community">
        <div class="community-tabs" id="comm-tabs">
          <button class="comm-tab active" onclick="commLoad('forum')">
            <svg class="icon" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M128 224a96 96 0 1 0-96-96c0 24.3 4.7 47.4 13.2 68.77L32 232l35.23-13.2A95.04 95.04 0 0 0 128 224Z"/><line x1="96" y1="112" x2="160" y2="112"/><line x1="96" y1="144" x2="160" y2="144"/></svg>
            论坛热帖
          </button>
          <button class="comm-tab" onclick="commLoad('events')">
            <svg class="icon" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="40" width="176" height="176" rx="16"/><line x1="40" y1="88" x2="216" y2="88"/><line x1="88" y1="24" x2="88" y2="56"/><line x1="168" y1="24" x2="168" y2="56"/><polyline points="104 152 120 168 160 128"/></svg>
            校园活动
          </button>
          <button class="comm-tab" onclick="commLoad('secondhand')">
            <svg class="icon" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="176 56 200 80 176 104"/><line x1="56" y1="80" x2="200" y2="80"/><polyline points="80 200 56 176 80 152"/><line x1="200" y1="176" x2="56" y2="176"/></svg>
            二手交易
          </button>
          <button class="comm-tab" onclick="commLoad('lostfound')">
            <svg class="icon" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="112" cy="112" r="72"/><line x1="168" y1="168" x2="224" y2="224"/></svg>
            失物招领
          </button>
        </div>
        <div class="comm-body" id="comm-body">
          <div class="loading-spinner">
            <svg class="icon icon-spin icon-lg" width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="128" y1="32" x2="128" y2="64"/><line x1="196" y1="60" x2="173.3" y2="82.7"/><line x1="224" y1="128" x2="192" y2="128"/><line x1="196" y1="196" x2="173.3" y2="173.3"/><line x1="128" y1="224" x2="128" y2="192"/><line x1="60" y1="196" x2="82.7" y2="173.3"/><line x1="32" y1="128" x2="64" y2="128"/><line x1="60" y1="60" x2="82.7" y2="82.7"/></svg>
            <span>加载中…</span>
          </div>
        </div>
      </section>

      <!-- ═══════ 个人主页 ═══════ -->
      <section class="page" id="page-profile">
        <div class="detail-body profile-scroll" id="profile-body">
          <div class="loading-spinner">
            <svg class="icon icon-spin icon-lg" width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="128" y1="32" x2="128" y2="64"/><line x1="196" y1="60" x2="173.3" y2="82.7"/><line x1="224" y1="128" x2="192" y2="128"/><line x1="196" y1="196" x2="173.3" y2="173.3"/><line x1="128" y1="224" x2="128" y2="192"/><line x1="60" y1="196" x2="82.7" y2="173.3"/><line x1="32" y1="128" x2="64" y2="128"/><line x1="60" y1="60" x2="82.7" y2="82.7"/></svg>
            <span>加载中…</span>
          </div>
        </div>
      </section>
    </div>

    <!-- ── 底部导航栏 ── -->
    <nav id="navbar">
      <button class="nav-item" data-tab="home">
        <svg class="icon nav-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M152 208v-56a8 8 0 0 0-8-8h-32a8 8 0 0 0-8 8v56a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-92.54a8 8 0 0 1 2.62-5.92l85.37-75.66a8 8 0 0 1 10.02 0l85.37 75.66a8 8 0 0 1 2.62 5.92V208a8 8 0 0 1-8 8h-56a8 8 0 0 1-8-8Z"/></svg>
        <span class="nav-label">首页</span>
      </button>
      <button class="nav-item" data-tab="zone">
        <svg class="icon nav-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="40" width="72" height="72" rx="12"/><rect x="144" y="40" width="72" height="72" rx="12"/><rect x="40" y="144" width="72" height="72" rx="12"/><rect x="144" y="144" width="72" height="72" rx="12"/></svg>
        <span class="nav-label">综合区</span>
      </button>
      <button class="nav-item active" data-tab="agent">
        <svg class="icon nav-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="56" width="192" height="144" rx="24"/><circle cx="92" cy="112" r="12"/><circle cx="164" cy="112" r="12"/><line x1="128" y1="136" x2="128" y2="168"/><line x1="92" y1="168" x2="164" y2="168"/><line x1="80" y1="56" x2="80" y2="32"/><line x1="176" y1="56" x2="176" y2="32"/><circle cx="84" cy="192" r="12"/><circle cx="172" cy="192" r="12"/></svg>
        <span class="nav-label">Agent</span>
      </button>
      <button class="nav-item" data-tab="community">
        <svg class="icon nav-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="92" cy="56" r="24"/><path d="M150 104a56 56 0 0 0-116 0"/><circle cx="176" cy="96" r="20"/><path d="M220 144a48 48 0 0 0-88 0"/></svg>
        <span class="nav-label">社区</span>
      </button>
      <button class="nav-item" data-tab="profile">
        <svg class="icon nav-icon" width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="80" r="40"/><path d="M64 216a96 96 0 0 1 128 0"/></svg>

    </nav>

  <!-- 历史对话面板（必须在 script 之前，确保 DOM 就绪） -->
  <div class="history-overlay" id="history-overlay" onclick="closeHistory()"></div>
  <div class="history-panel" id="history-panel">
    <div class="history-panel-header">
      <button class="history-back" onclick="historyBack()">
        <svg class="icon icon-sm" width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="216" y1="128" x2="40" y2="128"/><polyline points="96 72 40 128 96 184"/></svg>
      </button>
      <span class="history-panel-title" id="history-panel-title">历史对话</span>
    </div>
    <div class="history-panel-body" id="history-panel-body">
      <div class="loading-spinner">
        <svg class="icon icon-spin icon-lg" width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="128" y1="32" x2="128" y2="64"/><line x1="196" y1="60" x2="173.3" y2="82.7"/><line x1="224" y1="128" x2="192" y2="128"/><line x1="196" y1="196" x2="173.3" y2="173.3"/><line x1="128" y1="224" x2="128" y2="192"/><line x1="60" y1="196" x2="82.7" y2="173.3"/><line x1="32" y1="128" x2="64" y2="128"/><line x1="60" y1="60" x2="82.7" y2="82.7"/></svg>
        <span>加载中…</span>
      </div>
    </div>
  </div>

  <script src="/app.js?v=20260718f"></script>
</body>
</html>
